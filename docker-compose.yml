version: '3.8'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spaces-backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: spaces
      DB_USERNAME: spaces_user
      DB_PASSWORD: spaces_password
    depends_on:
      - mysql

  mysql:

    image: mysql:8.0
    container_name: spaces-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: spaces
      MYSQL_USER: spaces_user
      MYSQL_PASSWORD: spaces_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
