openapi: 3.0.3
info:
  title: Reservation System API
  description: API for managing areas, workplaces, bookings, booking series, and roles.
  version: 1.0.0

servers:
  - url: https://api.example.com

security:
  - RoleAuth: []

components:
  securitySchemes:
    RoleAuth:
      type: http
      scheme: basic

  schemas:

    Role:
      type: object
      properties:
        name:
          type: string
        passwordHash:
          type: string
        permissions:
          type: object
          additionalProperties:
            type: boolean
      required:
        - name
        - permissions

    Area:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
        maxBookingDurationMinutes:
          type: integer
        maxBookingEndOffsetDays:
          type: integer
        sortOrder:
          type: integer
      required:
        - id
        - name
        - color
        - maxBookingDurationMinutes

    Workplace:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [OK, DEFECT, DISABLED]
        location:
          type: string
        areaId:
          type: string
        wikiUrl:
          type: string
          format: uri
        maxBookingDurationMinutes:
          type: integer
          nullable: true
        blocksWorkplaceIds:
          type: array
          items:
            type: string
        blocksWorkplacesWithTag:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        sortOrder:
          type: integer
      required:
        - id
        - name
        - status
        - areaId

    Booking:
      type: object
      properties:
        id:
          type: string
        creatorRole:
          type: string
        workplaceId:
          type: string
        name:
          type: string
        contact:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        bookingSeriesId:
          type: string
          nullable: true
      required:
        - id
        - creatorRole
        - workplaceId
        - name
        - contact
        - startTime
        - endTime
        - bookingSeriesId

    BookingSeries:
      type: object
      properties:
        id:
          type: string
        interval:
          type: string
          enum: [DAYLY, WEEKLY, MONTHLY]
        intervalCount:
          type: integer
          minimum: 1
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        instantiatedUntil:
          type: string
          format: date
      required:
        - id
        - interval
        - intervalCount
        - startDate
        - endDate
        - instantiatedUntil

    Error:
      type: object
      properties:
        message:
          type: string

paths:

  /roles:
    get:
      summary: List roles
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'

    post:
      summary: Create role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: Role created

  /roles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Role updated

    delete:
      summary: Delete role
      responses:
        '204':
          description: Role deleted

  /areas:
    get:
      summary: List areas
      responses:
        '200':
          description: List of areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Area'

    post:
      summary: Create area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Area'
      responses:
        '201':
          description: Area created

  /areas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Area'
      responses:
        '200':
          description: Area updated

    delete:
      summary: Delete area
      responses:
        '204':
          description: Area deleted

  /workplaces:
    get:
      summary: List workplaces
      parameters:
        - name: includeDisabled
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of workplaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workplace'

    post:
      summary: Create workplace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workplace'
      responses:
        '201':
          description: Workplace created

  /workplaces/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update workplace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workplace'
      responses:
        '200':
          description: Workplace updated

    delete:
      summary: Delete workplace
      responses:
        '204':
          description: Workplace deleted

  /bookings:
    get:
      summary: List bookings
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: workplaceId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'

    post:
      summary: Create booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
      responses:
        '201':
          description: Booking created
        '409':
          description: Booking conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /bookings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
      responses:
        '200':
          description: Booking updated
        '409':
          description: Booking conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete booking
      responses:
        '204':
          description: Booking deleted

  /booking-series:
    get:
      summary: List booking series
      responses:
        '200':
          description: List of booking series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingSeries'

    post:
      summary: Create booking series
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingSeries'
      responses:
        '201':
          description: Booking series created
        '200':
          description: Created with warnings (conflicting instances skipped)
          content:
            application/json:
              schema:
                type: object
                properties:
                  warnings:
                    type: array
                    items:
                      type: string

  /booking-series/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Update booking series
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingSeries'
      responses:
        '200':
          description: Booking series updated

    delete:
      summary: Delete booking series
      responses:
        '204':
          description: Booking series deleted
