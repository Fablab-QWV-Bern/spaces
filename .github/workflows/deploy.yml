name: Deploy

# Plesk pulls from GitHub but cannot build Angular itself — there is no Node on
# the server. So this run builds the interface and puts the result onto the
# `deploy` branch: the Laravel directory at the root, the built SPA in `public/`.
# That is exactly the branch Plesk fetches.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two concurrent runs would rewrite the branch under one another. Do not cancel
# but queue — a cancelled run would leave behind a deployment without a matching
# interface.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the interface
        working-directory: frontend
        run: npm run build

      - name: Write the deploy branch
        env:
          REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail

          # What belongs on the server. Frontend sources, the spec, docker-compose
          # and the workflows stay behind; `backend/.gitignore` additionally keeps
          # `vendor/`, `.env` and the contents of `storage/` out — Composer runs on
          # the server, and the other two belong there rather than in the
          # repository.
          tree="$(mktemp -d)"
          cp -R backend/. "$tree"/
          # -L: the build leaves reservation-api.yml as a symlink into spec/ (one
          # source of truth, no drift). It has to become a real file here — Plesk
          # gets only this tree, not spec/.
          cp -RL frontend/dist/frontend/browser/. "$tree"/public/

          # A continuous history rather than a force push: Plesk keeps a clone of
          # its own and pulls with `git pull` — a rewritten branch would get stuck
          # there. So work in a fresh clone and only append.
          target="$(mktemp -d)"
          if git ls-remote --exit-code --heads "$REPO" deploy >/dev/null 2>&1; then
            git clone --depth=1 --branch deploy "$REPO" "$target"
            git -C "$target" ls-files -z | xargs -0 --no-run-if-empty rm -f --
          else
            git clone --depth=1 "$REPO" "$target"
            git -C "$target" switch --orphan deploy
          fi

          cp -R "$tree"/. "$target"/
          cd "$target"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'Nothing changed, no new state.'
          else
            git commit -m "Deployment from ${GITHUB_SHA:0:7}"
            git push origin deploy
          fi

      # Without a configured webhook, Plesk pulls of its own accord (button or its
      # own schedule); the run still counts as successful.
      - name: Trigger Plesk
        env:
          HOOK: ${{ secrets.PLESK_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
          else
            echo 'Kein PLESK_DEPLOY_HOOK hinterlegt — Plesk muss selbst ziehen.'
          fi
