<button
  type="button"
  class="bar"
  [attr.popovertarget]="cardId"
  [attr.aria-label]="block().title"
  [class.blockage]="block().isBlockage"
  [class.booking]="!block().isBlockage"
  [class.clipped-start]="block().clippedStart"
  [class.clipped-end]="block().clippedEnd"
  [style.grid-column]="block().gridColumn"
  [style.background]="block().color"
>
  @if (block().isSeries) {
    <span class="series" aria-label="Teil einer Serie">↻</span>
  }
  <span class="text">{{ block().label }}</span>
</button>

<app-booking-card [id]="cardId" [details]="block().card" />
