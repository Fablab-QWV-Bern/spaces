@if (vm$ | async; as vm) {
  <div class="calendar-container timeline-container">
    <div class="toolbar">
      <div class="controls-group">
        <label for="wp-select">Arbeitsplatz:</label>
        <select id="wp-select" [ngModel]="vm.workplaceId" (ngModelChange)="onWorkplaceChange($event)">
          @for (area of vm.areas; track area.id) {
            <optgroup [label]="area.name">
              @for (wp of area.workplaces; track wp.id) {
                <option [value]="wp.id" [disabled]="wp.status === 'DISABLED'">
                  {{ wp.name }} @if(wp.status === 'DISABLED') { (Inaktiv) }
                </option>
              }
            </optgroup>
          }
        </select>
      </div>

      <div class="date-controls">
        <button (click)="setDate(-daysToShow)">Zurück</button>
        <button (click)="setDate(0)">Heute</button>
        <button (click)="setDate(daysToShow)">Weiter</button>
        <span class="current-date">Ab {{ vm.startDate | date:'d. MMMM' }}</span>
      </div>
    </div>

    <div class="timeline-scroll-area">
      <app-timeline-header
        [startHour]="startHour"
        [endHour]="endHour"
        [intervalMinutes]="intervalMinutes"
        [slotWidth]="slotWidth">
        Datum
      </app-timeline-header>

      <div class="timeline-body">
        @for (dayVm of vm.days; track dayVm.date) {
            <app-timeline-track
              [startHour]="startHour"
              [endHour]="endHour"
              [intervalMinutes]="intervalMinutes"
              [slotWidth]="slotWidth"
              [events]="dayVm.events"
              [referenceDate]="dayVm.date">
                <div class="timeline-sticky-col clickable" (click)="navigateToCalendar(dayVm.date)">
                   <div style="display:flex; flex-direction:column; justify-content:center;">
                      <span style="font-weight:bold;">{{ dayVm.date | date:'EE' }}</span>
                      <span style="color:#666;">{{ dayVm.date | date:'d. MMM' }}</span>
                   </div>
                </div>
            </app-timeline-track>
        }
      </div>
    </div>
  </div>
} @else {
  <div class="loading-state">Lade Arbeitsplatz-Kalender...</div>
}
