<div class="timeline-row">
  <div class="timeline-sticky-col">
    <ng-content></ng-content>
  </div>
  <div class="timeline-track-col">
    <div class="track-container" [style.min-width.px]="slots.length * slotWidth">
      <!-- Grid Lines -->
      @for (slot of slots; track slot) {
        <div class="grid-line"
             [style.width.px]="slotWidth"
             [class.major]="(slot | date:'mm') === '00'"></div>
      }

      <!-- Now Indicator -->
      <div class="now-indicator" [ngStyle]="getNowStyle()"></div>

      <!-- Events -->
      @for (event of events; track event.id) {
        <div class="timeline-event"
             [ngStyle]="getEventStyle(event)"
             [title]="event.title + (event.subtitle ? ' (' + event.subtitle + ')' : '')">
          <div class="event-content">
            <div class="event-title">{{ event.title }}</div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
