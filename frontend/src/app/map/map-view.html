<app-calendar-toolbar
  [heading]="heading()"
  [date]="store.date()"
  [navigable]="false"
  [onMap]="true"
/>

@if (planError() ?? store.error(); as error) {
  <p class="error" role="alert">{{ error }}</p>
}

<!-- The stage always stands, including during the recurring reload: if it hung
     off `store.loading()`, every refresh would clear the grafted floor plan away
     and it would have to be fetched and measured again. -->
<div class="stage">
  <div class="plan" [style.--aspect-number]="aspect()">
    <div class="drawing" #drawing></div>

    @if (figureBox(); as box) {
      @for (figure of figures(); track figure.workplaceId) {
        <app-map-figure [placement]="figure.placement" [details]="figure.details" [figure]="box" />
      }
    } @else if (!planError()) {
      <p class="hint">Wird geladen …</p>
    }
  </div>
</div>
